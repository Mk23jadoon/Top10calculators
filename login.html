            margin-top: 25px;

        .links {

        .links a {

            margin: 0 10px;

        .error {

        }
        
        .server-response {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        
        .server-response.success {
            background-color: #d4edda;
            color: #155724;
            display: none;
        }
        
        .server-response.error {
            background-color: #f8d7da;
            color: #721c24;
            display: none;
        }
        
        .password-toggle {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 42px;
            transform: translateY(-50%);
            cursor: pointer;
            color: #777;
        }
        
        @media (max-width: 768px) {

        }

    <div class="container">
        <div class="header">
            <h1>Welcome Back</h1>
            <p>Sign in to your Top 10 Calculators account</p>
        </div>
        
        <div class="form-container">
            <div class="server-response" id="serverResponse"></div>
            
            <form id="loginForm" action="login.php" method="POST">
                <div class="form-group">
                    <label for="username" class="form-label required">Username or Email</label>
                    <input type="text" id="username" name="username" class="form-input" required>
                    <div class="error" id="usernameError">Please enter your username or email</div>
                </div>
                
                <div class="form-group password-toggle">
                    <label for="password" class="form-label required">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                    <span class="toggle-password" id="togglePassword">👁️</span>
                    <div class="error" id="passwordError">Please enter your password</div>
                </div>
                
                <div class="form-group">
                    <label for="remember" class="form-label">
                        <input type="checkbox" id="remember" name="remember" value="1"> Remember me
                    </label>
                </div>
                
                <div class="btn-container">
                    <button type="submit" class="submit-btn">Sign In</button>
                </div>
                
                <div class="links">
                    <a href="#">Forgot Password?</a> | 
                    <a href="signup.html">Create Account</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Basic validation
            let isValid = true;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Reset errors
            document.querySelectorAll('.error').forEach(el => el.style.display = 'none');
            
            // Validate username/email
            if (!username) {
                document.getElementById('usernameError').style.display = 'block';
                isValid = false;
            }
            
            // Validate password
            if (!password) {
                document.getElementById('passwordError').style.display = 'block';
                isValid = false;
            }
            
            if (isValid) {
                // Submit the form via AJAX
                const formData = new FormData(this);
                
                fetch(this.action, {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    const responseElement = document.getElementById('serverResponse');
                    if (data.success) {
                        responseElement.className = 'server-response success';
                        responseElement.innerHTML = data.message;
                        // Redirect on successful login
                        setTimeout(() => {
                            window.location.href = data.redirect || 'dashboard.html';
                        }, 1500);
                    } else {
                        responseElement.className = 'server-response error';
                        responseElement.innerHTML = data.message;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    const responseElement = document.getElementById('serverResponse');
                    responseElement.className = 'server-response error';
                    responseElement.innerHTML = 'An error occurred. Please try again.';
                });
            }
        });

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                this.textContent = '🔒';
            } else {
                passwordInput.type = 'password';
                this.textContent = '👁️';
            }
        });
    </script>
