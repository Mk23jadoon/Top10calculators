    <div class="container">
        <div class="header">
            <h1>Contact Us</h1>
            <p>We'd love to hear from you! Send us a message.</p>
        </div>
        
        <div class="form-container">
            <div class="server-response" id="serverResponse"></div>
            
            <form id="feedbackForm" action="submit_feedback.php" method="POST">
                <div class="form-section">
                    <h3 class="section-title">Your Information</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name" class="form-label required">Full Name</label>
                            <input type="text" id="name" name="name" class="form-input" required>
                            <div class="error" id="nameError">Please enter your name</div>
                        </div>
                        <div class="form-group">
                            <label for="email" class="form-label required">Email Address</label>
                            <input type="email" id="email" name="email" class="form-input" required>
                            <div class="error" id="emailError">Please enter a valid email address</div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="subject" class="form-label required">Subject</label>
                            <select id="subject" name="subject" class="form-select" required>
                                <option value="">Select a subject</option>
                                <option value="General Inquiry">General Inquiry</option>
                                <option value="Technical Support">Technical Support</option>
                                <option value="Feature Request">Feature Request</option>
                                <option value="Bug Report">Bug Report</option>
                                <option value="Partnership">Partnership</option>
                                <option value="Other">Other</option>
                            </select>
                            <div class="error" id="subjectError">Please select a subject</div>
                        </div>
                        <div class="form-group">
                            <label for="priority" class="form-label">Priority</label>
                            <select id="priority" name="priority" class="form-select">
                                <option value="Low">Low</option>
                                <option value="Normal" selected>Normal</option>
                                <option value="High">High</option>
                                <option value="Urgent">Urgent</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="form-section">
                    <h3 class="section-title">Your Message</h3>
                    <div class="form-group">
                        <label for="message" class="form-label required">Message</label>
                        <textarea id="message" name="message" class="form-textarea" required></textarea>
                        <div class="error" id="messageError">Please enter your message</div>
                    </div>
                </div>
                
                <div class="btn-container">
                    <button type="submit" class="submit-btn">Send Message</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Basic validation
            let isValid = true;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;
            
            // Reset errors
            document.querySelectorAll('.error').forEach(el => el.style.display = 'none');
            
            // Validate name
            if (!name) {
                document.getElementById('nameError').style.display = 'block';
                isValid = false;
            }
            
            // Validate email
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            }
            
            // Validate subject
            if (!subject) {
                document.getElementById('subjectError').style.display = 'block';
                isValid = false;
            }
            
            // Validate message
            if (!message) {
                document.getElementById('messageError').style.display = 'block';
                isValid = false;
            }
            
            if (isValid) {
                // Submit the form via AJAX
                const formData = new FormData(this);
                
                fetch(this.action, {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    const responseElement = document.getElementById('serverResponse');
                    if (data.success) {
                        responseElement.className = 'server-response success';
                        responseElement.innerHTML = data.message;
                        // Reset form on successful submission
                        document.getElementById('feedbackForm').reset();
                    } else {
                        responseElement.className = 'server-response error';
                        responseElement.innerHTML = data.message;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    const responseElement = document.getElementById('serverResponse');
                    responseElement.className = 'server-response error';
                    responseElement.innerHTML = 'An error occurred. Please try again.';
                });
            }
        });
    </script>
